apiVersion: apps/v1
kind: Deployment
metadata:
  name: dep-svel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: svel
  template:
    metadata:
      labels:
        app: svel
    spec:
      containers:
      - name: con-svel
        image: 084550838259.dkr.ecr.ap-northeast-2.amazonaws.com/svelte:3

---

apiVersion: v1
kind: Service
metadata:
  name: svelte-svc
spec:
  type: ClusterIP
  selector:
    app: svel
  ports:
  - port: 80
    targetPort: 80
